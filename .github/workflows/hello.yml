name: Hello

on:
  push:  
    branches:
      - main
    paths:
       - '**.html'
       - '**.yml'
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: say hello to users
        run: echo "hello dosto"
        
      - name: say hello to username
        # Changed $USER to ${{ github.actor }} to show the real GitHub username
        run: echo "Hello ${{ github.actor }}"    

  details:
    runs-on: ubuntu-latest
    steps:
      - name: show what is the version of python, docker, etc
        # Split into separate lines for cleaner, easier-to-read logs
        run: |
          docker --version
          python3 --version
