name: Hello

on:
  push:  
    branches:
      - main
    paths:
       - '**.html' # Only trigger when HTML files change
  workflow_dispatch: # Adds a button in GitHub to run this manually anytime

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: say hello to users
        run: echo "hello dosto"
        
      - name: say hello to username
        run: echo "Hello ${{ github.actor }}"    

  details:
    runs-on: ubuntu-latest
    steps:
      - name: show what is the version of python, docker, etc
        run: |
          docker --version
          python3 --version
